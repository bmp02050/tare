<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Tare Notice Log</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1b1d21; --muted: #5d636b;
    --line: #dedbd4; --accent: #1f6f9e; --ok: #1f7a52; --warn: #9a5a00;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a; --surface: #1e2126; --text: #eceae6; --muted: #a3a8af;
      --line: #30343a; --accent: #6fb3dc; --ok: #5cc99a; --warn: #e0a24a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --surface: #1e2126; --text: #eceae6; --muted: #a3a8af;
    --line: #30343a; --accent: #6fb3dc; --ok: #5cc99a; --warn: #e0a24a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--ok); border-color: currentColor; }
  .pill.warn { color: var(--warn); border-color: currentColor; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lab { border: 0; border-radius: var(--radius); padding: 16px 12px; min-height: 84px; color: #fff; text-align: left;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; cursor: pointer;
    font: inherit; touch-action: manipulation; transition: transform .08s ease; }
  .lab:active { transform: scale(.97); }
  .lab b { font-size: 17px; }
  .lab span { font-size: 12.5px; opacity: .88; }
  .lab.plain { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { font: inherit; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text);
    padding: 10px 14px; min-height: 44px; cursor: pointer; touch-action: manipulation; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.n { width: 52px; font-weight: 600; }
  .btn.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 30px rgba(0,0,0,.18); transform: translateY(110%); transition: transform .2s ease; }
  .sheet.open { transform: none; }
  .sheet-inner { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
  .sheet h2 { font-size: 17px; margin: 0; }
  .q { font-size: 14px; color: var(--muted); margin: 0; }
  input[type=text] { font: inherit; width: 100%; padding: 10px 12px; min-height: 44px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .note-row { display: flex; gap: 8px; }
  .note-row input { flex: 1; min-width: 0; }
  section.recent { margin-top: 22px; }
  section.recent h3 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  li time { color: var(--muted); font-variant-numeric: tabular-nums; width: 46px; flex: none; }
  li .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  li .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .meta { color: var(--muted); font-size: 13px; }
  li button { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 6px; cursor: pointer; }
  footer { margin-top: 18px; display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
  footer a { color: var(--accent); }
  .hidden { display: none !important; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
</style>
</head>
<body>
<header>
  <h1 id="title">Notice</h1>
  <span id="status" class="pill">…</span>
</header>
<p class="sub" id="subtitle">Tap what you notice. One tap is enough.</p>

<div id="aware" class="hidden">
  <p class="q" style="font-size:16px;color:var(--text);margin-bottom:10px" id="awareQ"></p>
  <div class="row">
    <button class="btn primary" data-aware="yes">Yes, already noticed</button>
    <button class="btn" data-aware="no">No, only now</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<section class="recent">
  <h3>Recent</h3>
  <ul id="recent"><li class="empty">Nothing yet.</li></ul>
</section>

<footer>
  <a id="mode" href="#checkin">Do a check-in</a>
  <a id="export" href="/export.csv">Export CSV</a>
</footer>

<div class="sheet" id="sheet" role="dialog" aria-live="polite">
  <div class="sheet-inner">
    <h2 id="sheetTitle">Logged</h2>
    <div class="note-row">
      <input type="text" id="note" placeholder="Note (optional)" maxlength="500" enterkeyhint="done">
      <button class="btn" id="noteSave">Add</button>
    </div>
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="undo">Undo</button>
      <button class="btn primary" id="done">Done</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- key (LAN mode) ----------
  const KEY = (() => {
    const k = new URLSearchParams(location.search).get("k");
    try { if (k) localStorage.setItem("tareKey", k); return k || localStorage.getItem("tareKey") || ""; }
    catch { return k || ""; }
  })();
  const hdrs = KEY ? { "X-Tare-Key": KEY } : {};
  document.getElementById("export").href = "/export.csv" + (KEY ? "?k=" + encodeURIComponent(KEY) : "");

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const p2 = (n) => String(Math.floor(Math.abs(n))).padStart(2, "0");
  function isoLocal(d = new Date()) {
    const off = -d.getTimezoneOffset();
    return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`
      + (off >= 0 ? "+" : "-") + p2(off / 60) + ":" + p2(off % 60);
  }
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(25); } catch {} };

  // ---------- offline-safe sending ----------
  let memQueue = [];
  const readQ = () => { try { return JSON.parse(localStorage.getItem("tareQueue") || "[]"); } catch { return memQueue; } };
  const writeQ = (q) => { memQueue = q; try { localStorage.setItem("tareQueue", JSON.stringify(q)); } catch {} };

  async function post(entry) {
    try {
      const r = await fetch("/api/log", { method: "POST", headers: { "Content-Type": "application/json", ...hdrs },
        body: JSON.stringify(entry) });
      if (r.status === 400) { console.warn("rejected", await r.text()); return true; } // don't retry bad rows forever
      return r.ok;
    } catch { return false; }
  }
  async function send(entry) {
    const q = readQ();
    if (q.length === 0 && await post(entry)) { setStatus(); return; }
    q.push(entry); writeQ(q); setStatus();
    flush();
  }
  let flushing = false;
  async function flush() {
    if (flushing) return; flushing = true;
    try {
      let q = readQ();
      while (q.length && await post(q[0])) { q = q.slice(1); writeQ(q); }
    } finally { flushing = false; setStatus(); loadRecent(); }
  }
  function setStatus() {
    const n = readQ().length, el = $("status");
    el.className = "pill " + (n ? "warn" : "ok");
    el.textContent = n ? `${n} waiting to save` : "saved";
  }
  setInterval(flush, 30000);
  addEventListener("online", flush);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) flush(); });

  // ---------- config + rendering ----------
  let labels = [], byId = {};
  async function loadConfig() {
    try {
      const r = await fetch("/api/config", { headers: hdrs });
      const cfg = await r.json();
      labels = cfg.labels; try { localStorage.setItem("tareLabels", JSON.stringify(labels)); } catch {}
    } catch {
      try { labels = JSON.parse(localStorage.getItem("tareLabels") || "[]"); } catch { labels = []; }
    }
    byId = Object.fromEntries(labels.map((l) => [l.id, l]));
    byId.other = { id: "other", text: "Other", color: "#5a6672" };
    byId.none = { id: "none", text: "Nothing notable", color: "#5a6672" };
  }

  function renderGrid(isCheckin) {
    const g = $("grid"); g.innerHTML = "";
    const items = [...labels, { id: "other", text: "Other", hint: "add a note", plain: true }];
    if (isCheckin) items.push({ id: "none", text: "Nothing notable", hint: "nothing in particular", plain: true });
    for (const l of items) {
      const b = document.createElement("button");
      b.className = "lab" + (l.plain ? " plain" : "");
      if (!l.plain) b.style.background = l.color;
      b.innerHTML = `<b></b><span></span>`;
      b.querySelector("b").textContent = l.text;
      b.querySelector("span").textContent = l.hint || "";
      b.addEventListener("click", () => (isCheckin ? checkinPick(l.id) : tap(l.id)));
      g.appendChild(b);
    }
  }

  async function loadRecent() {
    let items = [];
    try { items = await (await fetch("/api/recent", { headers: hdrs })).json(); } catch { return; }
    const ul = $("recent"); ul.innerHTML = "";
    if (!items.length) { ul.innerHTML = '<li class="empty">Nothing yet.</li>'; return; }
    for (const it of items) {
      const li = document.createElement("li");
      const l = byId[it.label] || { text: it.label, color: "#888" };
      const t = it.t_client ? it.t_client.slice(11, 16) : "";
      li.innerHTML = `<time></time><span class="dot"></span><span class="what"></span><span class="meta"></span><button aria-label="Undo">undo</button>`;
      li.querySelector("time").textContent = t;
      li.querySelector(".dot").style.background = l.color;
      li.querySelector(".what").textContent = l.text + (it.note ? " · " + it.note : "");
      const meta = [];
      if (it.kind === "checkin") meta.push(it.aware_before === "yes" ? "check-in ✓" : it.aware_before === "no" ? "check-in ✗" : "check-in");
      li.querySelector(".meta").textContent = meta.join(" · ");
      const ub = li.querySelector("button");
      ub.addEventListener("click", () => {  // two taps: a stray touch shouldn't undo an entry
        if (ub.dataset.armed) { voidRow(it.id); return; }
        ub.dataset.armed = "1"; ub.textContent = "tap to undo"; ub.style.color = "var(--warn)";
        setTimeout(() => { delete ub.dataset.armed; ub.textContent = "undo"; ub.style.color = ""; }, 3000);
      });
      ul.appendChild(li);
    }
  }

  // ---------- follow-up sheet ----------
  let current = null, hideTimer = null;
  function openSheet(id, title, focusNote) {
    current = id;
    $("sheetTitle").textContent = title;
    $("note").value = "";
    $("sheet").classList.add("open");
    if (focusNote) setTimeout(() => $("note").focus(), 150);
    armHide();
  }
  function closeSheet() { $("sheet").classList.remove("open"); current = null; clearTimeout(hideTimer); loadRecent(); }
  function armHide() { clearTimeout(hideTimer); hideTimer = setTimeout(() => { if (document.activeElement !== $("note")) closeSheet(); else armHide(); }, 20000); }
  $("done").addEventListener("click", closeSheet);
  function saveNote() {
    const v = $("note").value.trim();
    if (current && v) { send({ id: uid(), kind: "amend", t_client: isoLocal(), ref: current, note: v }); $("note").value = ""; $("note").blur(); buzz(); }
    armHide();
  }
  $("noteSave").addEventListener("click", saveNote);
  $("note").addEventListener("keydown", (e) => { if (e.key === "Enter") saveNote(); });
  $("undo").addEventListener("click", () => { if (current) voidRow(current); closeSheet(); });
  function voidRow(id) { send({ id: uid(), kind: "void", t_client: isoLocal(), ref: id }); buzz(); setTimeout(loadRecent, 300); }

  // ---------- actions ----------
  function tap(labelId) {
    const id = uid();
    send({ id, kind: "event", t_client: isoLocal(), label: labelId });
    buzz();
    const time = new Date().toTimeString().slice(0, 5);
    openSheet(id, `Logged: ${byId[labelId].text} · ${time}`, labelId === "other");
  }

  let pendingCheckin = null;
  function checkinPick(labelId) {
    buzz();
    if (labelId === "none") {
      send({ id: uid(), kind: "checkin", t_client: isoLocal(), label: "none" });
      $("subtitle").textContent = "Thanks. Logged.";
      setTimeout(() => { location.hash = ""; }, 1200);
      return;
    }
    pendingCheckin = { id: uid(), kind: "checkin", t_client: isoLocal(), label: labelId };
    $("awareQ").textContent = `${byId[labelId].text}: had you noticed it before this check-in?`;
    $("aware").classList.remove("hidden");
    $("grid").classList.add("hidden");
  }
  document.querySelectorAll("[data-aware]").forEach((b) => b.addEventListener("click", () => {
    if (!pendingCheckin) return;
    pendingCheckin.aware_before = b.dataset.aware;
    send(pendingCheckin); buzz();
    const e = pendingCheckin; pendingCheckin = null;
    $("aware").classList.add("hidden"); $("grid").classList.remove("hidden");
    location.hash = "";
    openSheet(e.id, `Check-in: ${byId[e.label].text}`, e.label === "other");
  }));

  // ---------- routing ----------
  function route() {
    const isCheckin = location.hash === "#checkin";
    $("title").textContent = isCheckin ? "Check-in" : "Notice";
    $("subtitle").textContent = isCheckin ? "What's here right now?" : "Tap what you notice. One tap is enough.";
    $("mode").textContent = isCheckin ? "Back to notice" : "Do a check-in";
    $("mode").href = isCheckin ? "#" : "#checkin";
    $("aware").classList.add("hidden"); $("grid").classList.remove("hidden");
    pendingCheckin = null;
    renderGrid(isCheckin);
  }
  addEventListener("hashchange", route);

  loadConfig().then(() => { route(); setStatus(); flush(); });
})();
</script>
</body>
</html>
